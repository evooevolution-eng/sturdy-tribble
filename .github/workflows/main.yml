name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: ZIP_FILE=$(ls -1 *.zip | head -n 1) && unzip -o "$ZIP_FILE" -d proj
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Signed APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mushaf-Ali-APK
          path: proj/app/build/outputs/apk/release/app-release.apk
